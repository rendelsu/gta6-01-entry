<style>

  #wrap { position: relative; }

  #bar { display: flex; justify-content: space-between; align-items: center; width: min(1280px, 96vw); color: #b8c8d8; padding: 8px 2px; font-size: 13px; }
  #muteBtn { background: #1c2634; color: #ffe14a; border: 1px solid #ffe14a55; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
  #muteBtn:hover { background: #263448; }
  a { color: #7fd4c1; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="720"></canvas></div>
